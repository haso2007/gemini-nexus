<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Gemini Nexus Bridge</title>
    <script vite-ignore src="preload.js"></script>
    <link rel="stylesheet" href="./index.css" />
  </head>
  <body>
    <!-- Skeleton Shell for Instant Paint -->
    <div id="skeleton">
      <div class="sk-header">
        <div class="sk-icon"></div>
        <div class="sk-icon"></div>
      </div>
      <div class="sk-content"></div>
      <div class="sk-footer">
        <div class="sk-input"></div>
      </div>
    </div>

    <!--
      CRITICAL FOR FIREFOX MV3:
      Firefox does not support `manifest.sandbox` or `content_security_policy.sandbox`.
      Explicitly declaring `sandbox="allow-scripts allow-forms allow-popups allow-modals"`
      on `#sandbox-frame` guarantees that `sandbox/index.html` runs inside an isolated
      opaque origin (`window.origin === "null"`) without WebExtension API privileges
      in both Chrome and Firefox.
    -->
    <iframe
      id="sandbox-frame"
      sandbox="allow-scripts allow-forms allow-popups allow-modals"
      allow="clipboard-write; display-capture"
    ></iframe>
    <script src="index.js" type="module"></script>
  </body>
</html>
